name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
            docs/bench/go.sum
            docs/regression/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Race test
        run: go test -race ./...

      - name: Coverage
        run: go test -coverprofile=coverage.txt ./...

      - name: Audit example output
        run: go run ./docs/examples-audit/main.go

      - name: Check generated documentation
        run: |
          make generate
          git diff --exit-code -- README.md examples

      - name: Check examples module
        working-directory: examples
        run: |
          go list -m all
          go test ./...

      - name: Check docs module
        working-directory: docs
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...

      - name: Check benchmark module
        working-directory: docs/bench
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...

      - name: Check regression benchmark module
        working-directory: docs/regression
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
          go test -run '^$' -bench . -benchtime=1x

      - name: Upload results to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
