name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
            docs/bench/go.sum
            docs/regression/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Race test
        run: go test -race ./...

      - name: Coverage
        run: go test -coverprofile=coverage.txt ./...

      - name: Audit example output
        run: go run ./docs/examples-audit/main.go

      - name: Check generated documentation
        run: |
          make generate
          git diff --exit-code -- README.md examples

      - name: Check examples module
        working-directory: examples
        run: |
          go list -m all
          go test ./...

      - name: Check docs module
        working-directory: docs
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...

      - name: Check benchmark module
        working-directory: docs/bench
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...

      - name: Check regression benchmark module
        working-directory: docs/regression
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
          go test -run '^$' -bench . -benchtime=1x

      - name: Upload results to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
